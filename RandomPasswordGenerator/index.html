<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="card">
        <h1>Password Generator</h1>

        <div class="output" id="output">
            <span id="password">Generate a password</span>
            <button id="copyBtn" class="icon-btn" title="Copy to clipboard" aria-label="Copy to clipboard">
                <svg viewBox="0 0 24 24" width="20" height="20" id="copyIcon">
                    <path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
            </button>
        </div>

        <div class="strength" id="strength">
            <div class="strength-bar">
                <span id="strengthFill"></span>
            </div>
            <span id="strengthLabel">Strength</span>
        </div>

        <div class="option-row">
            <label for="length">Length</label>
            <span id="lengthValue">16</span>
        </div>
        <input type="range" id="length" min="4" max="64" value="16" class="slider">

        <div class="checkbox-group">
            <label class="toggle">
                <input type="checkbox" id="uppercase" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                Uppercase (A–Z)
            </label>
            <label class="toggle">
                <input type="checkbox" id="lowercase" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                Lowercase (a–z)
            </label>
            <label class="toggle">
                <input type="checkbox" id="numbers" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                Numbers (0–9)
            </label>
            <label class="toggle">
                <input type="checkbox" id="symbols" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                Symbols (!@#$%…)
            </label>
            <label class="toggle">
                <input type="checkbox" id="excludeAmbiguous">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                Exclude ambiguous (l 1 I O 0)
            </label>
            <label class="toggle">
                <input type="checkbox" id="excludeDuplicates">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                No repeated characters
            </label>
        </div>

        <button id="generateBtn" class="generate-btn">Generate Password</button>

        <p class="error" id="errorMsg"></p>
    </main>

    <div class="toast" id="toast">Copied to clipboard</div>

    <script src="index.js"></script>
</body>

</html>
